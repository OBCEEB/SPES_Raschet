# Research configuration — Lipetsk radiation adjustment study
# Unknown values are left null; do not invent them.

site:
  name: Lipetsk
  # Primary radiation + sunshine duration (SSD) site
  radiation:
    name: Kon-Kolodez
    name_ru: Конь-Колодезь
    latitude_deg: 52.135409
    longitude_deg: 39.163510
    elevation_m: null
    timezone: Europe/Moscow
  # Cloud-base (НГО) site — ASMG Lipetsk airport
  ngo:
    name: Lipetsk airport
    name_ru: Аэропорт Липецк
    asmg_station_code: "27930"
    latitude_deg: 52.697862
    longitude_deg: 39.524295
    elevation_m: null
    timezone: Europe/Moscow
  # Modeling choice: treat NGO as co-located with radiation; document spatial mismatch
  model_co_located: true
  co_location_note: >
    No co-located cloud series at Kon’-Kolodez’. For modeling, treat cloudiness/NGO
    as if measured at the radiation site; spatial mismatch is a documented limitation.
  # Convenience fields used by pipeline (radiation site coords)
  latitude_deg: 52.135409
  longitude_deg: 39.163510
  elevation_m: null
  timezone: Europe/Moscow

paths:
  # Primary analysis series (existing merged 30-min Q+NGO)
  sqlite: Data/spes_meteo.sqlite
  handbook_dir: data/raw/handbook
  raw_meteo_archive: метеорология
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: figures
  tables_dir: tables
  reports_dir: reports
  # Regenerate:
  #   analysis\.venv\Scripts\python.exe analysis\src\run_pipeline.py

period:
  # From current Data/spes_meteo.sqlite probe; re-check after re-import
  start: "2023-02-28"
  end: "2025-12-31"
  cadence_minutes: 30

# Observed irradiance units (user-confirmed 2026-10-15)
units:
  # Raw CSV header Q, Вт/м2; SQLite column name q_mjm2 is a misnomer
  radiation_raw_column: q_mjm2
  radiation_analysis_column: radiation_wm2
  radiation_unit: W/m2
  radiation_note: >
    User-confirmed: observed values are W/m². Do not convert from MJ/m².
    Analysis outputs use radiation_wm2 (= q_mjm2).
  handbook_irradiance_unit: W_h/m2
  handbook_unit_note: >
    Product SolarData comments: Вт·ч/м². UI sometimes labels МДж/м² — analysis
    follows code comments. Hourly Wh/m² over 1 h ≡ mean W/m² for that hour.

quality_control:
  min_solar_elevation_deg: 5
  allow_cloud_enhancement: true
  flatline_window_hours: 6
  max_missing_fraction: 0.2

clear_sky:
  model: ineichen_perez_2002
  # pvlib preferred but not installable here; local implementation of same formulas
  linke_turbidity: 3.0
  g_cs_min_wm2: 5.0
  surface: horizontal
  elevation_m_fallback: 160

handbook_bref:
  method: daily_total_x_handbook_sin_altitude
  # IrradianceData.csv is façade-only; DailyTotalData.csv is horizontal daily energy

model:
  target: clear_sky_index
  transformation: null  # log_or_logit_to_be_selected
  seasonal_spline: cyclic
  seasonal_basis_dimension: null  # to_be_selected_on_train
  include_year_random_effect: true
  include_day_random_effect: true
  include_ar1_residual: true
  include_sunshine_fraction: true
  include_cloud_base: true

validation:
  strategy: year_holdout
  # Only years with usable SQLite radiation
  train_years: [2023]
  val_years: [2024]
  test_years: [2025]
  test_year: 2025
  block_bootstrap: daily

collector:
  area_m2: null
  tilt_deg: null
  azimuth_deg: null
  efficiency_model: null
